<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#042959">
<title>Lotus Bus — واجهة السائق</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="../shared/mb.css">
<link rel="stylesheet" href="driver.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-brand">
    <span class="topbar-logo">L</span>
    <span>Lotus Bus</span>
    <span class="topbar-role">واجهة السائق</span>
    <span class="status-pill" id="statusPill" data-state="off">
      <span class="pulse"></span>
      <span id="statusText">متصل</span>
    </span>
  </div>
  <div class="row topbar-actions">
    <select id="driverSel" class="drv-sel" aria-label="اختيار السائق"></select>
    <nav class="role-nav" aria-label="التنقل بين الواجهات">
      <a href="../index.html">الرئيسية</a>
      <a href="../student/">الطالب</a>
      <a href="../driver/" class="active">السائق</a>
      <a href="../admin/">الإدارة</a>
    </nav>
  </div>
</header>

<div class="alert-banner" id="alertBanner" role="alert" aria-live="assertive" hidden>
  <strong class="alert-title" id="alertTitle"></strong>
  <span class="alert-sub" id="alertSub"></span>
  <span class="alert-more" id="alertMore" hidden></span>
  <span class="alert-close">اضغط للإغلاق</span>
</div>

<main class="wrap">
  <div class="alert-bar">
    <button class="alert-toggle" id="alertToggle" type="button" aria-pressed="true">🔔 التنبيهات: تشغيل</button>
    <button class="alert-test" id="alertTest" type="button">اختبار التنبيه</button>
    <span class="audio-hint" id="audioHint">اضغط في أي مكان لتفعيل الصوت</span>
  </div>

  <div class="drv-grid">
    <!-- Primary Column: Unified Driving Mode Card (Trip Header + Live Map + Next Request + Primary Action) -->
    <div class="drv-col">
      <section class="card m-order-1" style="padding:12px">
        <div class="row drv-trip-head" style="margin-bottom:10px">
          <div class="grow">
            <h2 id="tripTitle" style="margin:0 0 2px;font-size:18px">جاري التحميل…</h2>
            <p class="mute" id="tripMeta" style="margin:0"></p>
          </div>
          <span class="badge info" id="schedBadge">جدول إلزامي من الإدارة 🔒</span>
        </div>

        <div class="drv-sched-box" id="drvSchedule" aria-label="جدول السائق اليومي المعتمد من الإدارة"></div>

        <div class="map drv-map" id="map"></div>

        <ol class="chain" id="chain"></ol>

        <div class="next-card" id="nextCard" style="margin-bottom:10px">
          <div class="grow">
            <span class="mute" id="nextLabel">أقرب طلب ركوب</span>
            <strong class="next-name" id="nextName">—</strong>
            <span class="badge info" id="nextWait" style="margin-top:4px"></span>
          </div>
          <div class="eta-box">
            <span class="eta-num" id="etaNum">—</span>
            <span class="mute" id="etaUnit"></span>
          </div>
        </div>

        <button class="btn big go-btn" id="btnMain" type="button">ابدأ الرحلة</button>
        <p class="mute hint" id="hint" style="margin:6px 0 0"></p>
      </section>
    </div>

    <!-- Secondary Column: Ready Requests List + Quick-Reply Chat -->
    <div class="drv-col">
      <section class="card m-order-2">
        <div class="row" style="justify-content:space-between;margin-bottom:8px">
          <h3 style="margin:0">طلبات الركوب على المسار</h3>
          <span class="badge info" id="reqCount">0</span>
        </div>
        <div id="reqList" class="req-list"></div>
      </section>

      <section class="card m-order-3">
        <div class="row" style="justify-content:space-between;margin-bottom:8px">
          <h3 style="margin:0">رد سريع وشات الرحلة</h3>
          <span class="badge info" id="chatSub"></span>
        </div>
        <div class="quick-row" id="quick"></div>
        <div class="msg-list" id="chatList"></div>
        <div class="chat-input">
          <input id="chatIn" type="text" maxlength="200" placeholder="أو اكتب رسالة مخصصة للطلاب..." autocomplete="off">
          <button class="btn" id="chatSend" type="button">إرسال</button>
        </div>
      </section>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="../shared/core.js"></script>
<script src="driver.js"></script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#042959">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lotus سائق">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../shared/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="../shared/icons/icon-192.png">
<title>Lotus Bus — واجهة السائق</title>
<link rel="stylesheet" href="../shared/vendor/leaflet.css">
<link rel="stylesheet" href="../shared/mb.css">
<link rel="stylesheet" href="driver.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-brand">
    <img class="topbar-logo" src="../shared/lum-crest.svg" alt="شعار جامعة اللوتس" width="34" height="34">
    <span>Lotus Bus</span>
    <span class="topbar-role">واجهة السائق</span>
    <span class="status-pill" id="statusPill" data-state="off">
      <span class="pulse"></span>
      <span id="statusText">متصل</span>
    </span>
  </div>
  <div class="row topbar-actions">
    <select id="driverSel" class="drv-sel" aria-label="اختيار السائق"></select>
  </div>
</header>

<div class="alert-banner" id="alertBanner" role="alert" aria-live="assertive" hidden>
  <strong class="alert-title" id="alertTitle"></strong>
  <span class="alert-sub" id="alertSub"></span>
  <span class="alert-more" id="alertMore" hidden></span>
  <span class="alert-close">اضغط للإغلاق</span>
</div>

<main class="wrap drv">
  <!-- Driving card: trip line, status, map with the nearest student on it, progress strip -->
  <section class="card drv-card">
    <button class="trip-line" id="tripLine" type="button" aria-expanded="false" aria-controls="drvSchedule">
      <span class="grow">
        <b id="tripTitle">جاري التحميل…</b>
        <small id="tripMeta"></small>
      </span>
      <span class="caret" aria-hidden="true">▾</span>
    </button>
    <div class="drv-sched-box" id="drvSchedule" aria-label="جدول السائق اليومي المعتمد من الإدارة" hidden></div>

    <div class="status-banner" id="statusBanner" data-tone="grey">
      <b id="statusMain">—</b>
      <span id="statusSub"></span>
    </div>

    <div class="map-wrap">
      <div class="map drv-map" id="map"></div>
    </div>

    <div class="dstrip" id="drvStrip" aria-label="تقدم الرحلة وطلبات الركوب"></div>
  </section>

  <section class="card" id="reqCard">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <h3 style="margin:0">طلبات الركوب قدامك</h3>
      <span class="badge info" id="reqCount">0</span>
    </div>
    <div id="reqList" class="req-list"></div>
  </section>

  <section class="card" id="chatCard">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <h3 style="margin:0">رد سريع للطلاب</h3>
      <span class="badge info" id="chatSub"></span>
    </div>
    <div class="quick-row" id="quick"></div>
    <div class="msg-list" id="chatList"></div>
    <button class="btn sec sm chat-open" id="chatToggle" type="button">✎ اكتب رسالة</button>
    <div class="chat-input" id="chatInputRow" hidden>
      <input id="chatIn" type="text" maxlength="200" placeholder="اكتب رسالة للطلاب..." autocomplete="off">
      <button class="btn" id="chatSend" type="button">إرسال</button>
    </div>
  </section>
</main>

<div class="bottom-bar" id="bottomBar">
  <button class="btn big go-btn ok" id="btnMain" type="button">ابدأ الرحلة</button>
  <button class="bb-btn" id="bbReq" type="button" aria-label="طلبات الركوب"><span aria-hidden="true">🔔</span><b id="bbCount">0</b></button>
  <button class="bb-btn" id="bbChat" type="button" aria-label="الرسائل"><span aria-hidden="true">💬</span><b id="bbChatCount" hidden>0</b></button>
</div>

<script src="../shared/vendor/leaflet.js"></script>
<script src="../shared/map.js?v=2"></script>
<script src="../shared/core.js"></script>
<script src="driver.js"></script>
</body>

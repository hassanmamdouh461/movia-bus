<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة Movia Bus</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="../shared/mb.css">
<style>
  :root{
    --radius-lg:18px;
    --shadow-sm:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.04);
    --shadow-md:0 10px 30px rgba(16,24,40,.10);
    --brand-grad:linear-gradient(135deg,#ff922b,#e8590c);
    --tone:var(--brand);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow-md:0 10px 30px rgba(0,0,0,.45)}}
  :root[data-theme="dark"]{--shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow-md:0 10px 30px rgba(0,0,0,.45)}
  body{padding-bottom:0;background:var(--bg);-webkit-font-smoothing:antialiased}

  /* top bar */
  .topbar{height:64px;padding:0 20px;box-shadow:var(--shadow-sm);border-bottom:0;backdrop-filter:saturate(1.4) blur(10px);background:color-mix(in srgb,var(--card) 88%,transparent)}
  .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
  .brand-mark{width:36px;height:36px;border-radius:11px;background:var(--brand-grad);color:#fff;display:grid;place-items:center;font-weight:800;box-shadow:0 6px 16px rgba(232,89,12,.35);flex:0 0 auto}
  .brand h1{font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .clock{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--bg)}

  /* shell */
  .adm-shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:18px;max-width:1360px;margin:0 auto;padding:18px 16px 40px;align-items:start}
  .adm-nav{position:sticky;top:84px;display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:var(--radius-lg);background:var(--card);box-shadow:var(--shadow-sm);border:1px solid var(--line)}
  .adm-nav a{padding:10px 12px;border-radius:12px;font-weight:600;font-size:14px;color:var(--ink);border:1px solid transparent;transition:background .18s,color .18s,border-color .18s,box-shadow .18s}
  .adm-nav a:hover{background:var(--bg);border-color:var(--line)}
  .adm-nav a.on{background:var(--brand-grad);color:#fff;box-shadow:0 6px 16px rgba(232,89,12,.3);border-color:transparent}
  .adm-main{min-width:0}
  .adm-main h2{font-size:21px;margin:4px 0 12px;letter-spacing:-.01em}
  .adm-main h3{font-size:16px;margin:0 0 8px}
  .head{margin-bottom:10px}
  .toolbar input[type=date]{width:auto}
  .tbl{overflow-x:auto}
  .acts{white-space:nowrap}
  .acts .btn{margin-inline-end:4px}
  td input,td select{width:auto;min-width:110px;padding:6px 8px}
  td input[type=time]{min-width:120px}
  tr.rm td{opacity:.55;text-decoration:line-through}
  .adm-main .card{border:1px solid transparent;border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);transition:box-shadow .2s}
  .adm-main .card:hover{box-shadow:var(--shadow-md)}
  table{border-spacing:0}
  th{position:sticky;top:0;background:var(--card);z-index:1}
  tbody tr{transition:background .15s}
  tbody tr:hover td{background:color-mix(in srgb,var(--brand) 4%,transparent)}
  td,th{padding:10px 8px}
  input,select,textarea{border-radius:12px;transition:border-color .15s,box-shadow .15s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
  .btn{transition:transform .12s,box-shadow .2s,filter .2s,background .2s;border-radius:12px}
  .btn:not(.sec):not(:disabled):hover{filter:brightness(1.06);box-shadow:0 6px 14px rgba(16,24,40,.14)}
  .btn:not(:disabled):active{transform:scale(.98)}
  .btn.sec:hover{background:var(--bg)}
  .badge{transition:background .2s;letter-spacing:.01em}
  .badge::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-inline-end:6px;vertical-align:middle;opacity:.8}
  .badge.ok,.badge.bad,.badge.warn,.badge.info{border-radius:999px}
  .scan-res{padding:12px 14px;border-radius:14px;margin-top:8px}
  .scan-res.ok{background:#d3f9d8;color:#2b8a3e}
  .scan-res.bad{background:#ffe3e3;color:#c92a2a}
  .rule{margin-bottom:8px;flex-wrap:nowrap}
  .rule input{flex:1}
  .priv li{margin-bottom:8px}
  .adm-busicon{background:none;border:0}
  .adm-busicon .pin.bus{font-size:10px;width:34px;height:34px;padding:0;line-height:1;transition:transform .9s linear;box-shadow:0 4px 12px rgba(0,0,0,.35)}
  .adm-note{font-size:13px;color:var(--mute);margin:8px 0 0}
  .print-only{display:none}

  /* KPI strip */
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
  .kcard{position:relative;overflow:hidden;background:var(--card);border-radius:var(--radius-lg);padding:16px 18px;box-shadow:var(--shadow-sm);border:1px solid transparent;transition:box-shadow .2s,transform .2s}
  .kcard:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
  .kcard::before{content:'';position:absolute;inset-inline-start:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--tone)}
  .kcard .klabel{font-size:13px;color:var(--mute);font-weight:600}
  .kcard .kval{font-size:28px;font-weight:800;margin:4px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .kcard .ksub{font-size:12px;color:var(--mute)}
  .kcard.ok{--tone:var(--ok)} .kcard.info{--tone:var(--info)} .kcard.warn{--tone:var(--warn)} .kcard.brand{--tone:var(--brand)}

  /* generic kpi (used inside views) */
  .grid .card .kpi{font-variant-numeric:tabular-nums;letter-spacing:-.02em}

  /* live map */
  .live-pill{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);border-radius:999px;padding:5px 12px}
  .live-pill i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:mbPulse 1.8s infinite}
  .map.live{height:min(70vh,720px);min-height:440px;border-radius:var(--radius-lg);box-shadow:var(--shadow-md);border:1px solid var(--line);margin:0 0 14px}
  .map.live .leaflet-container{font-family:inherit}
  @keyframes mbPulse{0%{box-shadow:0 0 0 0 rgba(47,158,68,.55)}70%{box-shadow:0 0 0 9px rgba(47,158,68,0)}100%{box-shadow:0 0 0 0 rgba(47,158,68,0)}}

  /* chat (read-only oversight) */
  .chat-card{padding:0;overflow:hidden}
  .chat-card .chat-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 60%,var(--card))}
  .chat-card .chat-head h3{margin:0;font-size:15px}
  .chat-list{display:flex;flex-direction:column;gap:8px;padding:14px 16px;max-height:340px;overflow:auto}
  .chat-msg{max-width:72%;padding:8px 12px;border-radius:14px;font-size:14px;line-height:1.6;display:flex;flex-direction:column;gap:2px;background:var(--bg);border:1px solid var(--line)}
  .chat-msg.drv{align-self:flex-start;border-start-start-radius:4px}
  .chat-msg.stu{align-self:flex-end;background:color-mix(in srgb,var(--brand) 12%,var(--card));border-start-end-radius:4px}
  .chat-msg .who{font-size:11px;font-weight:700;color:var(--mute)}
  .chat-msg .tm{font-size:11px;color:var(--mute);align-self:flex-end;font-variant-numeric:tabular-nums}
  .chat-msg .txt{word-break:break-word;white-space:pre-wrap}

  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  @media print{
    .topbar,.adm-nav,.no-print,.toast,.kpis,.live-pill{display:none!important}
    .adm-shell{display:block;padding:0}
    body{background:#fff;color:#000}
    .adm-main .card{border:0;box-shadow:none;break-inside:avoid}
    th,td{color:#000}
    .print-only{display:block}
  }
  @media (max-width:1100px){
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width:760px){
    .adm-shell{grid-template-columns:1fr;padding:12px;gap:12px}
    .adm-nav{position:sticky;top:60px;z-index:40;flex-direction:row;overflow-x:auto;background:var(--bg);box-shadow:none;border:0;padding:6px 0;gap:6px}
    .adm-nav a{white-space:nowrap;flex:0 0 auto}
    .topbar{padding:0 12px}
    .brand h1{font-size:15px}
    .clock{display:none}
    .kpis{gap:10px}
    .kcard{padding:12px 14px}
    .kcard .kval{font-size:22px}
    .map.live{min-height:360px}
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">M</span>
    <h1>إدارة Movia Bus <span class="mute">· لوحة العمليات</span></h1>
  </div>
  <span class="clock" id="clock">--:--:--</span>
</header>

<div class="adm-shell">
  <nav class="adm-nav" id="nav" aria-label="أقسام الإدارة"></nav>
  <main class="adm-main">
    <section id="kpis" class="kpis" aria-label="مؤشرات اليوم"></section>
    <section id="view"></section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="../shared/core.js"></script>
<script src="admin.js"></script>
</body>
</html>

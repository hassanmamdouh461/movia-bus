<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lotus Bus — لوحة الإدارة</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="../shared/mb.css">
<style>
  body { padding-bottom: 32px; background: var(--bg); }

  .clock {
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 10px;
    background: var(--bg);
  }

  .adm-shell {
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr);
    gap: 16px;
    max-width: 1240px;
    margin: 0 auto;
    padding: 16px;
    align-items: start;
  }

  .adm-nav {
    position: sticky;
    top: 68px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 8px;
    border-radius: 12px;
    background: var(--card);
    border: 1px solid var(--line);
  }

  .adm-nav a {
    padding: 10px 12px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    color: var(--ink-soft);
    transition: background 0.15s, color 0.15s;
  }

  .adm-nav a:hover {
    background: var(--bg);
    color: var(--ink);
  }

  .adm-nav a.on {
    background: var(--brand);
    color: #fff;
  }

  .adm-main { min-width: 0; }
  .adm-main h2 { font-size: 19px; margin: 0 0 10px; font-weight: 800; }
  .adm-main h3 { font-size: 15.5px; margin: 0 0 8px; font-weight: 800; }
  .head { margin-bottom: 10px; justify-content: space-between; }
  .toolbar input[type=date] { width: auto; }
  .acts { white-space: nowrap; }
  .acts .btn { margin-inline-end: 4px; }
  td input, td select { width: auto; min-width: 110px; padding: 5px 8px; }
  td input[type=time] { min-width: 115px; }
  tr.rm td { opacity: 0.5; text-decoration: line-through; }

  .scan-res { padding: 10px 14px; border-radius: 8px; margin-top: 8px; font-weight: 700; }
  .scan-res.ok { background: var(--ok-bg); color: var(--ok); }
  .scan-res.bad { background: var(--bad-bg); color: var(--bad); }
  .rule { margin-bottom: 8px; flex-wrap: nowrap; }
  .rule input { flex: 1; }
  .priv li { margin-bottom: 6px; }
  .adm-busicon { background: none; border: 0; }
  .adm-note { font-size: 13px; color: var(--mute); margin: 8px 0 0; }

  /* KPI strip */
  .kpis {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 14px;
  }

  .kcard {
    background: var(--card);
    border-radius: 12px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-right: 4px solid var(--brand);
  }

  .kcard.ok { border-right-color: var(--ok); }
  .kcard.info { border-right-color: var(--info); }
  .kcard.warn { border-right-color: var(--warn); }

  .kcard .klabel { font-size: 13px; color: var(--mute); font-weight: 700; }
  .kcard .kval { font-size: 24px; font-weight: 800; margin: 2px 0; color: var(--ink); }
  .kcard .ksub { font-size: 12px; color: var(--mute); }

  .live-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ok);
    background: var(--ok-bg);
    border-radius: 6px;
    padding: 4px 10px;
  }

  .live-pill i {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ok);
  }

  .map.live {
    height: 360px;
    border-radius: 12px;
    border: 1px solid var(--line);
    margin: 0 0 12px;
  }

  @media print {
    .topbar, .adm-nav, .no-print, .toast, .kpis, .live-pill { display: none !important; }
    .adm-shell { display: block; padding: 0; }
    body { background: #fff; color: #000; }
    .adm-main .card { border: 1px solid #ccc; box-shadow: none; break-inside: avoid; }
  }

  @media (max-width: 960px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .adm-shell { grid-template-columns: 1fr; }
    .adm-nav {
      position: static;
      flex-direction: row;
      overflow-x: auto;
      padding: 6px;
    }
    .adm-nav a { white-space: nowrap; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-brand">
    <span class="topbar-logo">L</span>
    <span>Lotus Bus</span>
    <span class="topbar-role">لوحة الإدارة والتحكم</span>
    <span class="clock" id="clock">--:--:--</span>
  </div>
  <nav class="role-nav" aria-label="التنقل بين الواجهات">
    <a href="../index.html">الرئيسية</a>
    <a href="../student/">الطالب</a>
    <a href="../driver/">السائق</a>
    <a href="../admin/" class="active">الإدارة</a>
  </nav>
</header>

<div class="adm-shell">
  <nav class="adm-nav" id="nav" aria-label="أقسام الإدارة"></nav>
  <main class="adm-main">
    <section id="kpis" class="kpis" aria-label="مؤشرات اليوم"></section>
    <section id="view"></section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="../shared/core.js"></script>
<script src="admin.js"></script>
</body>
</html>

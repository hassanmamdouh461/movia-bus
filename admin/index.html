<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#042959">
<title>Lotus Bus — لوحة الإدارة</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="../shared/mb.css">
<style>
  body { padding-bottom: 32px; background: var(--bg); }

  .clock {
    font-variant-numeric: tabular-nums;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: var(--r-pill);
    padding: 4px 12px;
    background: var(--bg);
    direction: ltr;
  }

  .adm-shell {
    display: grid;
    grid-template-columns: 230px minmax(0, 1fr);
    gap: 16px;
    max-width: 1280px;
    margin: 0 auto;
    padding: 16px;
    align-items: start;
  }

  .adm-nav {
    position: sticky;
    top: 68px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 8px;
    border-radius: 16px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: var(--sh);
  }

  .adm-nav a {
    padding: 10px 14px;
    border-radius: var(--r-pill);
    font-weight: 800;
    font-size: 14px;
    color: var(--ink-soft);
    transition: background 0.15s, color 0.15s;
  }

  .adm-nav a:hover {
    background: var(--bg);
    color: var(--ink);
  }

  .adm-nav a.on {
    background: var(--brand);
    color: #fff;
  }

  .adm-main { min-width: 0; }
  .adm-main h2 { font-size: 19px; margin: 0 0 10px; font-weight: 800; }
  .adm-main h3 { font-size: 15.5px; margin: 0 0 8px; font-weight: 800; }
  .head { margin-bottom: 10px; justify-content: space-between; gap: 10px; }
  .toolbar { gap: 8px; }
  .toolbar input[type=date], .toolbar select { width: auto; min-width: 150px; }
  .acts { white-space: nowrap; }
  .acts .btn { margin-inline-end: 4px; }
  td input, td select { width: auto; min-width: 110px; padding: 5px 8px; }
  td input[type=time] { min-width: 115px; }
  tr.rm td { opacity: 0.5; text-decoration: line-through; }

  .scan-res { padding: 10px 14px; border-radius: 8px; margin-top: 8px; font-weight: 700; }
  .scan-res.ok { background: var(--ok-bg); color: var(--ok); }
  .scan-res.bad { background: var(--bad-bg); color: var(--bad); }
  .rule { margin-bottom: 8px; flex-wrap: nowrap; gap: 8px; }
  .rule input { flex: 1; min-width: 0; }
  .rule .btn { flex-shrink: 0; }
  .priv ul { margin: 0; padding-inline-start: 18px; }
  .priv li { margin-bottom: 6px; font-size: 14px; }
  .adm-busicon { background: none; border: 0; }
  .adm-note { font-size: 13px; color: var(--mute); margin: 8px 0 0; }

  /* KPI strip */
  .kpis {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 14px;
  }

  .kcard {
    background: var(--card);
    border-radius: 16px;
    padding: 16px 18px;
    border: 1px solid var(--line);
    border-right: 4px solid var(--brand);
    box-shadow: var(--sh);
    min-width: 0;
  }

  .kcard.brand { border-right-color: var(--brand); }
  .kcard.ok { border-right-color: var(--ok); }
  .kcard.info { border-right-color: var(--info); }
  .kcard.warn { border-right-color: var(--warn); }

  .kcard .klabel { font-size: 12.5px; color: var(--mute); font-weight: 700; }
  .kcard .kval { font-size: 26px; font-weight: 900; margin: 3px 0; color: var(--ink); }
  .kcard .ksub { font-size: 11.5px; color: var(--mute); }

  .live-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 800;
    color: var(--ok);
    background: var(--ok-bg);
    border-radius: var(--r-pill);
    padding: 4px 12px;
  }

  .live-pill i {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ok);
  }

  .map.live {
    height: 360px;
    border-radius: 18px;
    border: 1px solid var(--line);
    margin: 0 0 12px;
  }

  @media print {
    .topbar, .adm-nav, .no-print, .toast, .kpis, .live-pill { display: none !important; }
    .adm-shell { display: block; padding: 0; }
    body { background: #fff; color: #000; }
    .adm-main .card { border: 1px solid #ccc; box-shadow: none; break-inside: avoid; }
  }

  @media (max-width: 960px) {
    .kpis {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .adm-shell {
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
      padding: 12px;
    }
    .adm-nav {
      position: sticky;
      top: 53px;
      z-index: 60;
      flex-direction: row;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding: 6px;
      border-radius: 10px;
    }
    .adm-nav::-webkit-scrollbar {
      display: none;
    }
    .adm-nav a {
      white-space: nowrap;
      padding: 8px 12px;
      font-size: 13px;
    }
  }

  @media (max-width: 680px) {
    .clock {
      margin-inline-start: auto;
    }
    .adm-shell {
      padding: 10px;
    }
    .adm-nav {
      top: 0;
    }
    .kpis {
      gap: 8px;
      margin-bottom: 10px;
    }
    .kcard {
      padding: 11px 12px;
      border-radius: 10px;
    }
    .kcard .kval {
      font-size: 20px;
    }
    .map.live {
      height: 260px;
    }
    .toolbar {
      width: 100%;
    }
    .toolbar input[type=date], .toolbar select {
      flex: 1;
      min-width: 0;
    }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-brand">
    <span class="topbar-logo">L</span>
    <span>Lotus Bus</span>
    <span class="topbar-role">لوحة الإدارة والتحكم</span>
    <span class="clock" id="clock">--:--:--</span>
  </div>
  <nav class="role-nav" aria-label="التنقل بين الواجهات">
    <a href="../index.html">الرئيسية</a>
    <a href="../student/">الطالب</a>
    <a href="../driver/">السائق</a>
    <a href="../admin/" class="active">الإدارة</a>
  </nav>
</header>

<div class="adm-shell">
  <nav class="adm-nav" id="nav" aria-label="أقسام الإدارة"></nav>
  <main class="adm-main">
    <section id="kpis" class="kpis" aria-label="مؤشرات اليوم"></section>
    <section id="view"></section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="../shared/core.js"></script>
<script src="admin.js"></script>
</body>
</html>
